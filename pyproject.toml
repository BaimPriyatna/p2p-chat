[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peerc"
version = "1.12.0"
description = "Peer-to-peer terminal chat and file transfer application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0",
    "rich>=13.0",
    "cryptography>=42.0",
    "keyring>=24.0",
]

[project.scripts]
peerc = "ui:main"
pchat = "ui:main"

[tool.setuptools]
py-modules = ["chat", "discovery", "file_transfer", "peer", "protocol", "ui"]
packages = ["core", "core.protocol", "core.identity", "core.trust", "core.crypto", "core.transport", "core.transfer", "core.security"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

