[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "p2p-chat"
version = "1.2.0"
description = "Peer-to-peer terminal chat and file transfer application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0",
    "rich>=13.0",
]

[project.scripts]
pchat = "ui:main"

[tool.setuptools]
py-modules = ["chat", "discovery", "file_transfer", "peer", "protocol", "ui"]
packages = ["core", "core.protocol"]
